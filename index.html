
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neko's Little Adventure</title>
<style>
html,body {
  margin:0; padding:0; overflow:hidden;
  width:100%; height:100%;
  background:#b8d8e8;
  font-family:sans-serif;
  touch-action:none;
}
canvas {display:block}
#info {
  position:absolute; top:12px; left:12px;
  color:white; background:#0008;
  padding:9px 12px; border-radius:10px;
  font-size:13px; pointer-events:none;
}
#stick {
  position:absolute; bottom:35px; left:25px;
  width:110px; height:110px;
  border-radius:50%; background:#ffffff55;
  border:2px solid #ffffffaa;
  touch-action:none;
}
#knob {
  position:absolute; width:45px; height:45px;
  left:31px; top:31px; border-radius:50%;
  background:#ffffffcc;
}
#jump {
  position:absolute; right:30px; bottom:45px;
  width:78px; height:78px; border-radius:50%;
  border:2px solid white; background:#e9a45bdd;
  color:white; font-size:17px; font-weight:bold;
  touch-action:none;
}
#hint {
  position:absolute; top:55px; left:12px;
  color:white; background:#0007; padding:7px;
  border-radius:8px; font-size:11px;
}
</style>
</head>
<body>
<div id="info">Neko's Little Adventure</div>
<div id="hint">左：移動 / 右：カメラ / JUMP：ジャンプ</div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">JUMP</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d8e8);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth/innerHeight, 0.1, 100
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777766,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
sun.castShadow=true;
scene.add(sun);

// 地面は road-crosswalk.glb を読み込む

// 猫の操作用グループ
const cat = new THREE.Group();
scene.add(cat);
cat.position.set(0,0,4.5);
// 開始時はカメラから見て後ろ向き（部屋の奥・-Z方向）
cat.rotation.y = Math.PI;

// GLB形式の猫モデルを読み込む
const loader = new GLTFLoader();

// 地面アセットを読み込む。モデル上端を y=0 に合わせる
loader.load(
  './road-crosswalk.glb',
  (gltf) => {
    const ground = gltf.scene;
    const groundBounds = new THREE.Box3().setFromObject(ground);
    ground.position.y -= groundBounds.max.y;
    ground.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });
    scene.add(ground);
  },
  undefined,
  (error) => {
    console.error('地面アセットの読み込みに失敗しました:', error);
    info.textContent = '地面を読み込めません。road-crosswalk.glb の配置を確認してください。';
  }
);
let catModel = null;
let catModelBaseY = 0;
let catMixer = null;
let walkPhase = 0;
const info = document.getElementById('info');

// バス停を読み込む
loader.load(
  './bus-stop-shelter.glb',
  (gltf) => {
    const busStop = gltf.scene;

    // バス停の大きさと位置を取得
    const bounds = new THREE.Box3().setFromObject(busStop);

    // 地面に接するように高さを調整
    busStop.position.y -= bounds.min.y;

    // 左上に配置
    busStop.position.x = -3.5;
    busStop.position.z = -5;

    // 影を設定
    busStop.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    scene.add(busStop);
  },
  undefined,
  (error) => {
    console.error('バス停の読み込みに失敗しました:', error);
    info.textContent = 'バス停を読み込めません。ファイル名を確認してください。';
  }
);

loader.load(
  './cow.glb',
  (gltf) => {
    const model = gltf.scene;

    // モデルの大きさを測り、高さ約1.3に調整する
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    if (size.y > 0) {
      const scale = 1.3 / size.y;
      model.scale.setScalar(scale);

      // モデルの中心を猫の位置に合わせ、足元を地面に置く
      model.position.x = -center.x * scale;
      model.position.z = -center.z * scale;
      model.position.y = -box.min.y * scale;
    }

    // モデル全体に影の設定を適用する
    model.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    cat.add(model);
    catModel = model;
    catModelBaseY = model.position.y;

    // GLBに歩行などのアニメーションが含まれていれば再生する
    if (gltf.animations && gltf.animations.length > 0) {
      catMixer = new THREE.AnimationMixer(model);
      catMixer.clipAction(gltf.animations[0]).play();
      info.textContent = "猫のモデルとアニメーションを読み込みました！";
    } else {
      info.textContent = "猫のモデルを読み込みました！";
    }
  },
  undefined,
  (error) => {
    console.error('猫モデルの読み込みに失敗しました:', error);
    info.textContent = "猫モデルを読み込めません。GLBの配置とファイル名を確認してください。";
  }
);

// 操作
let joyX=0, joyY=0;
let yaw=0, velocityY=0, grounded=true;
let cameraPointer=null;
let lastX=0;

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');

stick.addEventListener('pointerdown',e=>{
  stick.setPointerCapture(e.pointerId);
  moveStick(e);
});

stick.addEventListener('pointermove',e=>{
  if(e.buttons) moveStick(e);
});

function moveStick(e) {
  const r=stick.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const len=Math.hypot(x,y);
  if(len>35){x*=35/len;y*=35/len;}
  joyX=x/35;
  joyY=y/35;
  knob.style.transform=`translate(${x}px,${y}px)`;
}

function resetStick() {
  joyX=0; joyY=0;
  knob.style.transform='translate(0px,0px)';
}
stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

// 右側スワイプでカメラ操作
renderer.domElement.addEventListener('pointerdown',e=>{
  cameraPointer=e.pointerId;
  lastX=e.clientX;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(cameraPointer===e.pointerId) {
    yaw-=(e.clientX-lastX)*0.006;
    lastX=e.clientX;
  }
});

renderer.domElement.addEventListener('pointerup',()=>{
  cameraPointer=null;
});

function jump() {
  if(grounded) {
    velocityY=5;
    grounded=false;
  }
}
document.getElementById('jump')
.addEventListener('pointerdown',jump);

// 家具を削除したため、家具の当たり判定もありません

// カメラと移動
const clock=new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  const speed=3;
  const forward=new THREE.Vector3(
    -Math.sin(yaw),0,-Math.cos(yaw)
  );
  const right=new THREE.Vector3(
    Math.cos(yaw),0,-Math.sin(yaw)
  );

  const move=new THREE.Vector3()
    .addScaledVector(right,joyX)
    .addScaledVector(forward,-joyY);

  if(move.length()>1) move.normalize();

  // 地面アセットの範囲内で移動する
  cat.position.x = THREE.MathUtils.clamp(
    cat.position.x + move.x * speed * dt, -4.5, 4.5
  );
  cat.position.z = THREE.MathUtils.clamp(
    cat.position.z + move.z * speed * dt, -5.4, 5.4
  );

  // 牛モデルの正面方向を補正して、移動方向を向かせる
  if (move.length() > 0.1) {
    cat.rotation.y = Math.atan2(-move.x, -move.z) + Math.PI;
  }
  // GLB内のアニメーションを再生。ない場合は体全体を小さく上下させる
  if (catMixer) {
    catMixer.update(dt);
  } else if (catModel) {
    const moving = move.length() > 0.1;
    walkPhase += dt * (moving ? 10 : 2.2);
    const bob = moving
      ? Math.abs(Math.sin(walkPhase)) * 0.045
      : Math.sin(walkPhase) * 0.012;
    catModel.position.y = catModelBaseY + bob;
    catModel.rotation.z = moving
      ? Math.sin(walkPhase) * 0.025
      : 0;
  }

  velocityY-=12*dt;
  cat.position.y+=velocityY*dt;

  if(cat.position.y<=0) {
    cat.position.y=0;
    velocityY=0;
    grounded=true;
  }

  // 猫を追いかけるカメラ
  const offset=new THREE.Vector3(
    Math.sin(yaw)*5,3,Math.cos(yaw)*5
  );

  const target=cat.position.clone()
    .add(new THREE.Vector3(0,0.7,0));

  camera.position.lerp(
    target.clone().add(offset),0.1
  );
  camera.lookAt(target);

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
